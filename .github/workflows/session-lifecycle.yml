name: Session lifecycle

on:
  push:
    paths:
      - src/service.rs
      - src/shutdown.rs
      - src/lib.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/session-lifecycle.yml
  pull_request:
    paths:
      - src/service.rs
      - src/shutdown.rs
      - src/lib.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/session-lifecycle.yml

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Test minimal supervisor lifecycle
        run: cargo test --locked --lib shutdown::tests
      - name: Test COSMIC supervisor profile
        run: cargo test --locked --lib --features cosmic-boot service::tests
      - name: Lint lifecycle policy
        run: >-
          cargo clippy --locked --lib --features cosmic-boot --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::manual_clamp
          -A clippy::new_without_default
          -A clippy::needless_range_loop
          -A clippy::collapsible_if
          -A clippy::clone_on_copy
      - name: Check formatting
        run: cargo fmt --all -- --check
